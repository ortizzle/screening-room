<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Family Movie Night — Ortiz Family</title>
<meta name="theme-color" content="#211820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movie Night">
<meta name="description" content="Family Movie Night — the Ortiz family's Friday-night memory book: picks, reactions, quotes, memories, stats, and trivia.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Nunito:ital,wght@0,400..900;1,400..700&family=Caveat:wght@500;700&display=swap');

:root{
  --room:#211820;
  --room-2:#2B202B;
  --card:#2E2430;
  --card-2:#3A2D3C;
  --line:#4E3E51;
  --cream:#FFEFD9;
  --dim:#B39DA8;
  --amber:#FFB454;
  --coral:#F2705F;
  --sage:#A8C686;
  --sky2:#8FB8DE;
  --star:#FFC94A;
  --paper:#F5E9D3;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--room);
  background-image:radial-gradient(ellipse 85% 45% at 50% -8%, #372638 0%, transparent 62%);
  color:var(--cream);
  font-family:'Nunito',system-ui,sans-serif;
  min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
button{cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* string lights across the top */
.lights{
  height:26px;width:100%;overflow:hidden;
  background-image:
    linear-gradient(to bottom, transparent 6px, #5A4A5C 6px, #5A4A5C 7.5px, transparent 7.5px),
    radial-gradient(circle 5px at 14px 16px, #FFB454 0 5px, #FFB45400 6.5px),
    radial-gradient(circle 5px at 50px 13px, #F2705F 0 5px, #F2705F00 6.5px),
    radial-gradient(circle 5px at 86px 17px, #A8C686 0 5px, #A8C68600 6.5px),
    radial-gradient(circle 5px at 122px 12px, #8FB8DE 0 5px, #8FB8DE00 6.5px),
    radial-gradient(circle 8px at 14px 16px, #FFB45433 0 8px, transparent 9px),
    radial-gradient(circle 8px at 50px 13px, #F2705F33 0 8px, transparent 9px),
    radial-gradient(circle 8px at 86px 17px, #A8C68633 0 8px, transparent 9px),
    radial-gradient(circle 8px at 122px 12px, #8FB8DE33 0 8px, transparent 9px);
  background-size:144px 26px;
  background-repeat:repeat-x;
}

/* header */
header{padding-top:14px;text-align:center}
header h1{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(26px,7vw,42px);color:var(--cream);
  text-shadow:0 0 24px rgba(255,180,84,.35);letter-spacing:.5px;
}
header h1 .pop{color:var(--amber)}
header .now{font-size:11.5px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:4px;font-weight:800}
header .doodles{font-size:13px;opacity:.55;margin-top:8px;letter-spacing:14px;-webkit-user-select:none;user-select:none}

/* projector screen — UP NEXT */
.screenbox{margin-top:24px;text-align:center}
.screen{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#FFFDF7 0%,#F3EADA 78%,#E9DEC8 100%);
  border:5px solid #17101A;border-radius:10px;
  box-shadow:0 0 0 2px var(--line), 0 16px 36px rgba(0,0,0,.45),
    inset 0 -14px 30px rgba(58,46,40,.08), inset 0 6px 24px rgba(255,255,255,.6);
  padding:22px 16px 24px;color:#4A3A32;
}
.screen-inner{position:relative;z-index:1}
.screen .label{font-size:11px;letter-spacing:4px;color:var(--coral);text-transform:uppercase;font-weight:900}
.screen .pickname{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(24px,6.5vw,34px);margin-top:6px;line-height:1.15;
}
.screen .showdate{font-size:13px;color:#8A7563;margin-top:6px;font-weight:800}
.screen .rotation{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:16px;flex-wrap:wrap}
.rot-chip{
  display:flex;align-items:center;gap:6px;background:#FFF9EE;border:2px solid #E2D4BC;
  border-radius:99px;padding:6px 13px 6px 8px;font-size:13px;font-weight:800;color:#8A7563;
  min-height:38px;
}
.rot-chip .dot{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:#2A1B14;
}
.rot-chip.current{color:#fff;border-color:transparent}
.rot-chip.current .dot{background:rgba(255,255,255,.35) !important;color:#fff}
.rot-arrow{color:#CBB99C;font-size:13px;font-weight:900}
.screen-stand{
  width:64px;height:13px;margin:0 auto;background:#17101A;border-radius:0 0 8px 8px;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
/* the movie is rolling: flicker, jitter, dust, film burns */
.burn{
  position:absolute;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle, rgba(255,150,50,.75) 0%, rgba(196,84,26,.45) 38%, rgba(120,40,10,.18) 62%, transparent 78%);
  filter:blur(5px);opacity:0;transform:scale(.2);
}
.burn.b1{top:-20px;right:6%}
.burn.b2{bottom:-10px;left:10%;width:90px;height:90px}
.dust{
  position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.35;
  background-image:
    radial-gradient(circle 1px at 22% 30%, rgba(74,58,50,.5) 0 1px, transparent 2px),
    radial-gradient(circle 1px at 71% 62%, rgba(74,58,50,.4) 0 1px, transparent 2px),
    radial-gradient(circle 1.5px at 48% 82%, rgba(74,58,50,.35) 0 1.5px, transparent 2.5px);
}
@media (prefers-reduced-motion: no-preference){
  .screen-inner{animation:flicker 6.5s infinite}
  .screen .pickname{animation:projjig .9s steps(2) infinite}
  .burn.b1{animation:burnpop 11s 2.2s infinite}
  .burn.b2{animation:burnpop 14s 7.6s infinite}
  .dust{animation:dustdrift 5s steps(3) infinite}
}
@keyframes flicker{
  0%,88%,100%{opacity:1}
  89%{opacity:.82} 90%{opacity:1} 91.5%{opacity:.9} 92%{opacity:1}
  96%{opacity:.94} 97%{opacity:1}
}
@keyframes projjig{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(.5px,-.4px)}
}
@keyframes burnpop{
  0%,100%{opacity:0;transform:scale(.2)}
  2%{opacity:.85;transform:scale(.7)}
  5%{opacity:.55;transform:scale(1.25)}
  8%{opacity:0;transform:scale(1.6)}
}
@keyframes dustdrift{
  0%{background-position:0 0, 0 0, 0 0}
  50%{background-position:14px 9px, -11px 6px, 7px -12px}
  100%{background-position:-9px 16px, 8px -10px, -13px 5px}
}

/* friday lineup (calendar) */
.lineup{
  margin-top:26px;background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:16px 16px 8px;box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.lineup .lu-head{
  font-size:11px;letter-spacing:3.5px;color:var(--amber);text-transform:uppercase;font-weight:900;
  margin:6px 0 4px;
}
.lineup .lu-head.second{margin-top:16px}
.lu-row{
  display:flex;align-items:center;gap:10px;min-height:46px;
  border-bottom:2px dashed #453648;padding:6px 2px;
}
.lu-row.last{border-bottom:none}
.lu-date{width:72px;flex-shrink:0}
.lu-date .d1{font-weight:900;font-size:13px}
.lu-date .d2{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.lu-pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.lu-pick .dot{
  width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#2A1B14;flex-shrink:0;
}
.lu-title{
  flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--cream);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lu-title.skip{color:#6B5770;font-style:italic;font-weight:600}
.lu-fill{flex:1}
.pdots{display:flex;gap:4px;flex-shrink:0}
.pdot{
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#2A1B14;border:2px solid var(--line);background:transparent;
}
.pdot.off{color:#6B5770}

/* quote — sticky note */
.quotewall{margin-top:28px;cursor:pointer;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center}
.sticky{
  background:linear-gradient(180deg,#FFE9B8,#FFDF9E);
  color:#4A3520;border-radius:4px;max-width:480px;width:100%;
  padding:18px 20px 20px;transform:rotate(-1.6deg);
  box-shadow:0 8px 22px rgba(0,0,0,.35);position:relative;
}
.sticky::before{
  content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(2deg);
  width:84px;height:20px;background:rgba(255,255,255,.35);border:1px solid rgba(0,0,0,.06);
  border-radius:2px;
}
.sticky blockquote{font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:1.25}
.sticky .attr{font-family:'Caveat',cursive;font-size:17px;margin-top:8px;opacity:.75;text-align:right}
.quotewall .hint{font-size:9px;letter-spacing:2px;color:#5E4C60;text-transform:uppercase;margin-top:10px;font-weight:800}

/* log button */
.log-btn{
  display:block;width:100%;margin-top:26px;border:none;border-radius:99px;
  background:linear-gradient(135deg,var(--amber),#FF9350);
  padding:17px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;
  color:#3A2410;min-height:56px;box-shadow:0 8px 24px rgba(255,180,84,.3);
  transition:transform .1s;
}
.log-btn:active{transform:scale(.98)}

/* filmstrip divider */
.film-divider{
  height:22px;margin:32px auto 0;max-width:300px;border-radius:5px;background-color:#17101A;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,239,217,.55) 5px 11px, transparent 11px 16px),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,239,217,.55) 5px 11px, transparent 11px 16px);
  background-size:16px 4px,16px 4px;
  background-position:2px 4px, 2px 14px;
  background-repeat:repeat-x,repeat-x;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transform:rotate(-.8deg);
}

.section-label{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px;
  color:var(--cream);margin:14px 0 2px;text-align:center;
}
.section-sub{font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}

/* memory-book night cards with tape corners */
.night{
  margin-top:22px;position:relative;background:var(--card);
  border:2px solid var(--line);border-radius:20px;padding:18px 14px 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.night::before,.night::after{
  content:'';position:absolute;width:66px;height:20px;border-radius:2px;
  background:rgba(255,239,217,.14);border:1px solid rgba(255,239,217,.10);
  pointer-events:none;
}
.night::before{top:-9px;left:16px;transform:rotate(-5deg)}
.night::after{bottom:-9px;right:16px;transform:rotate(4deg)}
.night .head{display:flex;gap:14px}
.night .poster{
  width:64px;height:92px;border-radius:3px;flex-shrink:0;
  border:4px solid #FFF6E6;border-bottom-width:14px;
  box-shadow:0 5px 14px rgba(0,0,0,.4);
  transform:rotate(-2.2deg);overflow:hidden;display:flex;align-items:flex-end;padding:4px;
  font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;line-height:1.15;
  background:var(--card-2);color:#fff;
}
.night .poster img{width:100%;height:100%;object-fit:cover}
.night .head-txt{flex:1;min-width:0;padding-right:26px}
.night h3{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1.15;color:var(--cream)}
.night .meta{font-size:12px;color:var(--dim);margin-top:3px;font-weight:800;letter-spacing:.5px}
.night .avgbadge{font-size:12px;font-weight:900;color:var(--star);margin-left:8px}
.ticket{
  display:inline-flex;align-items:stretch;margin-top:9px;transform:rotate(-1.4deg);
  border-radius:6px;overflow:hidden;font-size:10px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:#3A2410;box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.ticket .admit{padding:5px 8px;display:flex;align-items:center;border-right:2px dashed rgba(58,36,16,.4)}
.ticket .tname{padding:5px 10px;display:flex;align-items:center}
.sampletag{
  font-size:9px;letter-spacing:2px;color:#6B5770;text-transform:uppercase;font-weight:900;
  border:2px dashed var(--line);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px;
}
.night .del{
  background:none;border:none;color:#6B5770;font-size:16px;padding:8px 10px;
  position:absolute;top:4px;right:4px;min-width:36px;min-height:36px;z-index:2;
}
.night .del:active{color:var(--coral)}
.rx-rows{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.rx-row{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--card-2);border:2px solid transparent;border-radius:14px;
  padding:9px 12px;min-height:46px;
}
.rx-row:active,.rx-row:focus-visible{border-color:var(--line)}
.rx-row .who{font-size:13px;font-weight:900;width:64px;flex-shrink:0}
.rx-row .stars{font-size:14px;color:var(--star);flex-shrink:0;letter-spacing:1.5px}
.rx-row .stars .off{color:#57465A}
.rx-row .snippet{
  flex:1;font-size:12.5px;color:var(--dim);font-style:italic;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.rx-row .snippet.empty{color:#6B5770}
.rx-row .chev{color:#6B5770;font-size:15px;font-weight:900}
.scrapbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:10px;min-height:46px;border-radius:14px;border:2px dashed var(--line);
  background:none;color:var(--amber);font-weight:800;font-size:13px;letter-spacing:.5px;
}
.scrapbtn:active{border-color:var(--amber)}
.scrapbtn .done{color:var(--sage)}

.empty-state{
  margin-top:20px;text-align:center;color:var(--dim);font-size:15px;line-height:1.7;font-weight:700;
  background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:32px 20px;
}
.empty-state .big{font-size:34px}

/* ============ SCRAPBOOK OVERLAY ============ */
.scrap-overlay{
  position:fixed;inset:0;z-index:1100;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);
  background-image:
    radial-gradient(circle 1px at 18% 12%, rgba(74,53,32,.12) 0 1px, transparent 2px),
    radial-gradient(circle 1px at 64% 38%, rgba(74,53,32,.10) 0 1px, transparent 2px),
    radial-gradient(circle 1.5px at 41% 72%, rgba(74,53,32,.08) 0 1.5px, transparent 2.5px),
    linear-gradient(180deg,#F8EEDC,#F0E2C8);
  color:#4A3520;
  padding:calc(16px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom));
}
.scrap-page{max-width:560px;margin:0 auto;padding:44px 22px 0}
.scrap-close{
  position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:1110;
  width:44px;height:44px;border-radius:50%;border:none;background:#3A2A20;color:var(--cream);
  font-size:18px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.sp-kicker{
  text-align:center;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-weight:900;
  color:#A3814F;margin-top:8px;
}
.sp-title{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,6.5vw,34px);
  text-align:center;line-height:1.1;margin-top:6px;color:#3A2A20;
}
.sp-date{text-align:center;font-family:'Caveat',cursive;font-size:20px;color:#8A6A44;margin-top:4px}
.sp-head{display:flex;justify-content:center;align-items:flex-start;gap:18px;margin-top:18px;flex-wrap:wrap}
.sp-polaroid{
  background:#FFFDF6;padding:8px 8px 30px;box-shadow:0 10px 24px rgba(74,53,32,.35);
  transform:rotate(-2.5deg);position:relative;width:132px;
}
.sp-polaroid::before{
  content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:70px;height:20px;background:rgba(255,235,180,.65);border:1px solid rgba(74,53,32,.1);
}
.sp-polaroid .ph{
  width:100%;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:flex-end;padding:5px;
  font-size:9px;font-weight:900;color:#fff;text-transform:uppercase;line-height:1.2;
}
.sp-polaroid .ph img{width:100%;height:100%;object-fit:cover}
.sp-polaroid .cap{
  font-family:'Caveat',cursive;font-size:17px;text-align:center;margin-top:7px;color:#5E4326;
}
.sp-headside{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:14px}
.sp-avg{
  font-size:22px;color:#E2A93B;letter-spacing:2px;text-shadow:0 1px 0 rgba(74,53,32,.2);
  transform:rotate(1.5deg);font-weight:900;
}
.sp-avg small{display:block;font-family:'Caveat',cursive;font-size:16px;color:#8A6A44;letter-spacing:0;text-align:center}
.sp-cluster{margin-top:30px;position:relative}
.sp-name{
  display:inline-block;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
  color:#fff;border-radius:8px;padding:5px 14px;transform:rotate(-1.5deg);
  box-shadow:0 3px 8px rgba(74,53,32,.3);letter-spacing:.5px;
}
.sp-stars{display:inline-block;margin-left:10px;color:#E2A93B;font-size:15px;letter-spacing:2px;font-weight:900}
.sp-char{
  margin-top:10px;font-family:'Caveat',cursive;font-size:19px;color:#5E4326;
  transform:rotate(.6deg);
}
.sp-note{
  margin-top:10px;background:#FFFDF6;border-radius:3px;padding:13px 15px;
  box-shadow:0 5px 14px rgba(74,53,32,.22);font-size:14.5px;font-weight:600;line-height:1.55;
  color:#4A3520;font-style:italic;
}
.sp-sticky{
  margin-top:12px;background:linear-gradient(180deg,#FFE9B8,#FFDF9E);border-radius:3px;
  padding:12px 15px 14px;box-shadow:0 5px 14px rgba(74,53,32,.22);
  font-family:'Caveat',cursive;font-weight:700;font-size:21px;line-height:1.25;color:#4A3520;
}
.sp-strip{
  margin-top:12px;border-radius:3px;padding:11px 14px;position:relative;
  box-shadow:0 5px 14px rgba(74,53,32,.18);font-size:13.5px;font-weight:700;line-height:1.5;
}
.sp-strip::before{
  content:'';position:absolute;top:-8px;left:14px;width:52px;height:15px;
  background:rgba(255,255,255,.5);border:1px solid rgba(74,53,32,.08);border-radius:2px;
  transform:rotate(-3deg);
}
.sp-waiting{
  margin-top:30px;text-align:center;font-family:'Caveat',cursive;font-size:20px;color:#8A6A44;
}
.sp-foot{
  margin-top:34px;text-align:center;font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:#B49670;font-weight:900;
}

/* ============ STATS ============ */
.stat-tiles{display:flex;gap:12px;margin-top:22px}
.stat-tile{
  flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:16px 12px;text-align:center;
}
.stat-tile .num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;color:var(--amber)}
.stat-tile .lbl{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:900;margin-top:2px}
.stat-member{
  margin-top:12px;background:var(--card);border:2px solid var(--line);border-left-width:7px;
  border-radius:16px;padding:13px 14px;
}
.stat-member .sm-head{display:flex;align-items:center;gap:9px}
.stat-member .sm-dot{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#2A1B14;
}
.stat-member .sm-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px}
.stat-member .sm-badge{
  margin-left:auto;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  color:var(--amber);border:2px dashed var(--line);border-radius:99px;padding:3px 9px;
}

/* ============ TAB BAR ============ */

<body>
<div class="lights" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   FAMILY MOVIE NIGHT — Ortiz Family · Prototype v0.5
   Tabs: Nights (log + memory book + lineup), Stats, Trivia.
   Reactions: stars, thought, favorite character, quotes[], memories[].
   Night scrapbook: everyone's entries collaged onto one paper page.
   Prototype: localStorage only. Gist family sync lands in v1.0 using
   the shared safe-merge + tombstone pattern. Standalone app.
   ===================================================================== */

/* ---------- Arizona time helpers (canonical) ---------- */
var AZ = {
  tz: 'America/Phoenix',
  today: function(){
    return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(new Date());
  },
  pretty: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  },
  prettyLong: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  },
  monthDay: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  },
  daysBetween: function(a, b){
    return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  },
  addDays: function(dateStr, n){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + n);
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  },
  nextFriday: function(){
    var t = this.today().split('-').map(Number);
    var d = new Date(t[0], t[1]-1, t[2]);
    var add = (5 - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + add);
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
};

/* ---------- localStorage wrapper (canonical) ---------- */
var Store = {
  ns: 'fmn_',
  get: function(key, fallback){
    if (fallback === undefined) fallback = null;
    try {
      var raw = localStorage.getItem(this.ns + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  },
  set: function(key, value){
    try { localStorage.setItem(this.ns + key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  },
  remove: function(key){ localStorage.removeItem(this.ns + key); }
};

/* ---------- the cast ---------- */
var MEMBERS = [
  { id:'chris',  name:'Chris',  color:'#FFB454', onWhite:'#B87A1E', paper:'#FBE3C0' },
  { id:'kat',    name:'Kat',    color:'#F2705F', onWhite:'#C94F3D', paper:'#FAD9CE' },
  { id:'sedona', name:'Sedona', color:'#A8C686', onWhite:'#6E9155', paper:'#E2EDCF' },
  { id:'river',  name:'River',  color:'#8FB8DE', onWhite:'#4E7FAE', paper:'#D8E6F4' }
];
function memberById(id){
  for (var i=0;i<MEMBERS.length;i++) if (MEMBERS[i].id === id) return MEMBERS[i];
  return MEMBERS[0];
}

/* ---------- TMDB (own key via Settings; standalone app) ---------- */
var TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
function detectCred(raw){
  var t = (raw || '').trim();
  if (!t) return null;
  if (t.indexOf('eyJ') === 0) return { type:'v4', value:t };
  return { type:'v3', value:t };
}
function loadTmdbCred(){
  var own = Store.get('tmdb_key');
  if (own) return detectCred(own);
  try {
    var raw = localStorage.getItem('sr_tmdb_key');
    if (raw){
      var v = JSON.parse(raw);
      if (v && v.type && v.value) return v;
    }
  } catch(e){}
  return null;
}
function tmdbSearch(query){
  var cred = loadTmdbCred();
  if (!cred) return Promise.reject(new Error('NO_KEY'));
  var url = 'https://api.themoviedb.org/3/search/movie?include_adult=false&query=' + encodeURIComponent(query);
  var headers = {};
  if (cred.type === 'v4') headers['Authorization'] = 'Bearer ' + cred.value;
  else url += '&api_key=' + encodeURIComponent(cred.value);
  return fetch(url, { headers: headers }).then(function(res){
    if (!res.ok) throw new Error('TMDB ' + res.status);
    return res.json();
  });
}

/* ---------- data ---------- */
var data = Store.get('data', { records:{} });
if (!data.records) data.records = {};

function saveData(){
  data.updatedAt = Date.now();
  if (!Store.set('data', data)) toast('Storage full — could not save');
}
function liveRecords(type){
  var out = [];
  for (var id in data.records){
    var r = data.records[id];
    if (r && !r.deleted && r.type === type) out.push(r);
  }
  return out;
}
function nights(){
  return liveRecords('night').sort(function(a,b){
    return a.date === b.date ? (b.updatedAt||0)-(a.updatedAt||0) : (a.date < b.date ? 1 : -1);
  });
}
function reactionFor(nightId, memberId){
  var r = data.records['rx_' + nightId + '_' + memberId];
  return (r && !r.deleted) ? r : null;
}
function rxQuotes(r){
  if (!r) return [];
  if (r.quotes && r.quotes.length) return r.quotes;
  return r.quote ? [r.quote] : [];
}
function rxMemories(r){
  if (!r) return [];
  if (r.memories && r.memories.length) return r.memories;
  return r.memory ? [r.memory] : [];
}
function rxHasContent(r){
  return !!(r && (r.stars > 0 || (r.thought||'').length || (r.character||'').length || rxQuotes(r).length || rxMemories(r).length));
}
function reactionsFor(nightId){
  var out = [];
  for (var i=0;i<MEMBERS.length;i++){
    var r = reactionFor(nightId, MEMBERS[i].id);
    if (r) out.push(r);
  }
  return out;
}
function familyAvg(nightId){
  var rs = reactionsFor(nightId).filter(function(r){ return r.stars > 0; });
  if (!rs.length) return null;
  var sum = 0;
  for (var i=0;i<rs.length;i++) sum += rs[i].stars;
  return sum / rs.length;
}
function nextPicker(){
  var list = nights();
  if (!list.length) return MEMBERS[0];
  var lastId = list[0].pickedBy;
  for (var i=0;i<MEMBERS.length;i++){
    if (MEMBERS[i].id === lastId) return MEMBERS[(i+1) % MEMBERS.length];
  }
  return MEMBERS[0];
}
function allQuotes(){
  var out = [];
  var ns = nights();
  for (var i=0;i<ns.length;i++){
    var rs = reactionsFor(ns[i].id);
    for (var j=0;j<rs.length;j++){
      var qs = rxQuotes(rs[j]);
      for (var k=0;k<qs.length;k++){
        out.push({ quote: qs[k], member: memberById(rs[j].member), movie: ns[i].title });
      }
    }
  }
  return out;
}
function nightNearDate(dateStr){
  var list = nights();
  for (var i=0;i<list.length;i++){
    if (Math.abs(AZ.daysBetween(dateStr, list[i].date)) <= 2) return list[i];
  }
  return null;
}

/* ---------- sample data (first run only; clearly flagged, one-tap clear) ---------- */
function seedSample(){
  if (Store.get('seeded') || nights().length) return;
  var now = Date.now();
  var seeds = [
    { title:'The Princess Bride', year:1987, date:'2026-07-10', pickedBy:'chris', grad:'linear-gradient(160deg,#8A6A2E,#3A2A0E)',
      rx: {
        chris:  { stars:5, thought:'Still perfect. The kids finally got why I say "inconceivable" all the time.', character:'Inigo Montoya', quotes:['Hello. My name is Inigo Montoya.'], memories:['All four of us saying the Montoya speech together by the end.'] },
        kat:    { stars:4, thought:'Holds up better than almost anything from the 80s.', character:'Westley', quotes:['As you wish.'], memories:['River gasping at the shrieking eels.'] },
        sedona: { stars:4, thought:'The sword fight was actually so good?', character:'Inigo Montoya', quotes:['Inconceivable!'], memories:['Dad quoting every line 2 seconds early.'] },
        river:  { stars:5, thought:'THE ROUS ARE REAL.', character:'Fezzik', quotes:['Anybody want a peanut?','Have fun storming the castle!'], memories:['Popcorn flew everywhere during the eel jump-scare.'] }
      } },
    { title:'Spider-Man: Into the Spider-Verse', year:2018, date:'2026-07-17', pickedBy:'kat', grad:'linear-gradient(160deg,#4A2E5E,#1E0E2A)',
      rx: {
        chris:  { stars:5, thought:'Best-looking animated movie ever made. Not close.', character:'Miles Morales', quotes:['That’s all it is, Miles. A leap of faith.'], memories:['Everyone dead silent during the leap scene.'] },
        kat:    { stars:5, thought:'The soundtrack carried the whole pizza dinner.', character:'Spider-Gwen', quotes:['Hey.'], memories:['Sedona adding the whole soundtrack to her playlist before credits ended.','The four of us doing the "hey" nod at dinner all week.'] },
        sedona: { stars:5, thought:'No notes. Peni Parker deserved more scenes.', character:'Peni Parker', quotes:['It’s a canon event.'], memories:['We paused it to argue about which Spider-person we’d each be.'] },
        river:  { stars:4, thought:'Spider-Ham is the best character and I will not be debating this.', character:'Spider-Ham', quotes:['That could be a baby photo.'], memories:['Doing the Miles shoulder-touch to Dad all weekend.'] }
      } },
    { title:'Jumanji: Welcome to the Jungle', year:2017, date:'2026-07-24', pickedBy:'sedona', grad:'linear-gradient(160deg,#2E5E4A,#0E2A1E)',
      rx: {
        chris:  { stars:3, thought:'Fun, loud, forgettable. Great pick for pizza night though.', character:'Dr. Smolder Bravestone', quotes:['I have a fanny pack full of gains.'], memories:['Kat crying laughing at the cake scene.'] },
        kat:    { stars:4, thought:'Jack Black playing a teenage girl is a career highlight.', character:'Professor Shelly Oberon', quotes:['I can’t even with this place.'], memories:['The cake scene. I had to pause it.'] },
        sedona: { stars:4, thought:'Good pick, me. The video-game lives idea is clever.', character:'Ruby Roundhouse', quotes:['Strengths: none. Weaknesses: cake.'], memories:['River checking his own "strengths and weaknesses" after.'] },
        river:  { stars:5, thought:'CAKE. BOOM.', character:'Franklin "Mouse" Finbar', quotes:['Weaknesses: cake.'], memories:['We all listed our video game strengths at breakfast.'] }
      } }
  ];
  for (var i=0;i<seeds.length;i++){
    var s = seeds[i];
    var nid = 'night_seed_' + i;
    data.records[nid] = { id:nid, type:'night', title:s.title, year:s.year, date:s.date,
      pickedBy:s.pickedBy, grad:s.grad, sample:true, updatedAt: now };
    for (var m in s.rx){
      var rid = 'rx_' + nid + '_' + m;
      data.records[rid] = { id:rid, type:'reaction', nightId:nid, member:m,
        stars:s.rx[m].stars, thought:s.rx[m].thought, character:s.rx[m].character,
        quotes:s.rx[m].quotes, memories:s.rx[m].memories,
        sample:true, updatedAt: now };
    }
  }
  Store.set('seeded', true);
  saveData();
}
function hasSample(){
  for (var id in data.records){
    var r = data.records[id];
    if (r && r.sample && !r.deleted) return true;
  }
  return false;
}
function clearSample(){
  var now = Date.now();
  for (var id in data.records){
    var r = data.records[id];
    if (r && r.sample && !r.deleted){
      data.records[id] = { id:r.id, type:r.type, deleted:true, sample:true, updatedAt:now };
    }
  }
  saveData();
  render();
  toast('Sample nights cleared — couch is all yours');
}

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function starString(n){
  var s = '';
  for (var i=1;i<=5;i++) s += (i<=n ? '★' : '☆');
  return s;
}
function starsNode(n){
  var span = el('span','stars');
  for (var i=1;i<=5;i++){
    span.appendChild(el('span', i<=n ? '' : 'off', i<=n ? '★' : '☆'));
  }
  return span;
}
function confettiBurst(count){
  var colors = ['#FFB454','#F2705F','#A8C686','#8FB8DE','#FFC94A','#FFEFD9'];
  var wrap = el('div','confetti');
  var n = count || 44;
  for (var i=0;i<n;i++){
    var p = document.createElement('i');
    p.style.left = (Math.random()*100) + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    p.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';

/* ---------- generic modal shell ---------- */
function openModal(build){
  var overlay = el('div','modal-overlay');
  var box = el('div','modal-box');
  overlay.appendChild(box);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
  build(box, function close(){ overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}
function confirmModal(opts){
  openModal(function(box, close){
    box.appendChild(el('h3', null, opts.title));
    box.appendChild(el('p', null, opts.message));
    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary', opts.cancelText || 'Cancel');
    cancel.addEventListener('click', close);
    var ok = el('button','btn-primary', opts.confirmText || 'OK');
    ok.addEventListener('click', function(){ close(); if (opts.onConfirm) opts.onConfirm(); });
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row);
  });
}

      sInput.type = 'search'; sInput.placeholder = 'Search movies (TMDB)…'; sInput.autocomplete = 'off';
      var resBox = el('div');

      sInput.addEventListener('input', function(){
        clearTimeout(timer);
        var q = sInput.value.trim();
        if (q.length < 2){ while (resBox.firstChild) resBox.removeChild(resBox.firstChild); return; }
        timer = setTimeout(function(){
          tmdbSearch(q).then(function(d){
            while (resBox.firstChild) resBox.removeChild(resBox.firstChild);

              });

        searchWrap.style.display = 'none';
        manualWrap.style.display = 'block';
      });
      searchWrap.appendChild(manualLink);
      manualWrap.style.display = 'none';
    } else {
      var note = el('div','m-note',
        'Tip: add a free TMDB key in Settings and you’ll get posters & movie search here. Manual entry works great too.');
      searchWrap.appendChild(note);

    var chips = el('div','pick-chips');
    var picked = nextPicker().id;
    MEMBERS.forEach(function(m){
      var c = el('button','pick-chip', m.name);
      c.type = 'button';
      function paint(){
        if (picked === m.id){ c.classList.add('on'); c.style.background = m.color; }
        else { c.classList.remove('on'); c.style.background = ''; }
      }
      c.addEventListener('click', function(){ picked = m.id; repaintAll(); });
      c._paint = paint;
      chips.appendChild(c);
    });
    function repaintAll(){
      var kids = chips.children;
      for (var i=0;i<kids.length;i++) if (kids[i]._paint) kids[i]._paint();

    moreQ.addEventListener('click', function(){ addQuoteInput('').focus(); });
    box.appendChild(moreQ);

    box.appendChild(el('div','f-label','Favorite movie night memories'));

      var m = el('textarea','f-area');
      m.placeholder = memList.children.length
        ? 'Another moment from the night…'
        : 'Not the movie — the night. What happened on the couch?';
      m.value = val || '';

      return m;
    }
    var exMems = rxMemories(existing);
    if (exMems.length) exMems.forEach(function(m){ addMemInput(m); });
    else addMemInput('');
    box.appendChild(memList);
    var moreM = el('button','linky','+ add another memory');
    moreM.type = 'button';
    moreM.addEventListener('click', function(){ addMemInput('').focus(); });
    box.appendChild(moreM);

    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary','Cancel');
    cancel.addEventListener('click', close);
    var save = el('button','btn-gold', existing ? 'Update' : 'Save Reaction');
    save.addEventListener('click', function(){
      var quotes = [];
      for (var i=0;i<quoteList.children.length;i++){
        var v = quoteList.children[i].value.trim();
        if (v) quotes.push(v);
      }
      var memories = [];
      for (var j=0;j<memList.children.length;j++){
        var mv = memList.children[j].value.trim();
        if (mv) memories.push(mv);
      }
      var id = 'rx_' + night.id + '_' + member.id;
      data.records[id] = {
        id:id, type:'reaction', nightId:night.id, member:member.id,
        stars:stars, thought:thought.value.trim(), character:character.value.trim(),
        quotes:quotes, memories:memories,
        updatedAt: Date.now()
      };
      saveData();
      close();
      render();
      if (stars === 5) confettiBurst();
      toast(stars ? member.name + ' gave it ' + starString(stars) : 'Saved ' + member.name + '’s reaction');
    });
    row.appendChild(cancel); row.appendChild(save);
    box.appendChild(row);
  });
}

  var waiting = [];

    var cluster = el('div','sp-cluster');
    var rots = [-1.6, 1.2, -0.8, 1.8];

    var nameTag = el('span','sp-name', m.name);
    nameTag.style.background = m.onWhite;
    nameTag.style.transform = 'rotate(' + rots[idx % 4] + 'deg)';
    cluster.appendChild(nameTag);
    if (r.stars) cluster.appendChild(el('span','sp-stars', starString(r.stars)));

    if (r.character){
      cluster.appendChild(el('div','sp-char', '⭐ Starring favorite: ' + r.character));
    }
    if (r.thought){
      var note = el('div','sp-note', '“' + r.thought + '”');
      note.style.transform = 'rotate(' + (rots[(idx+1) % 4] * 0.6) + 'deg)';
      cluster.appendChild(note);
    }
    rxQuotes(r).forEach(function(q, qi){
      var st = el('div','sp-sticky', '“' + q + '”');
      st.style.transform = 'rotate(' + (rots[(idx+qi) % 4]) + 'deg)';
      cluster.appendChild(st);
    });
    rxMemories(r).forEach(function(mem, mi){
      var strip = el('div','sp-strip', '📌 ' + mem);
      strip.style.background = m.paper;
      strip.style.color = '#4A3520';
      strip.style.transform = 'rotate(' + (rots[(idx+mi+2) % 4] * 0.7) + 'deg)';
      cluster.appendChild(strip);
    });
    page.appendChild(cluster);
    idx++;
  });

  if (waiting.length){
    page.appendChild(el('div','sp-waiting', 'still waiting on ' + waiting.join(' & ') + ' … 🍿'));
  }
  page.appendChild(el('div','sp-foot','The Ortiz Family · est. Fridays'));

  overlay.appendChild(page);
  document.body.appendChild(overlay);
}

function shuffledOrder(n){
  var arr = [];
  for (var i=0;i<n;i++) arr.push(i);
  for (var j=arr.length-1;j>0;j--){
    var k = Math.floor(Math.random()*(j+1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  return arr;
}

  var inner = el('div','screen-inner');
  inner.appendChild(el('div','label','Up next…'));
  var pn = el('div','pickname', 'It’s ' + np.name + '’s turn to pick! 🍿');
  pn.style.color = np.onWhite;
  inner.appendChild(pn);
  inner.appendChild(el('div','showdate','Next movie night · ' + AZ.prettyLong(AZ.nextFriday())));
  var rot = el('div','rotation');
  MEMBERS.forEach(function(m, i){
    var chip = el('div','rot-chip' + (m.id === np.id ? ' current' : ''));
    if (m.id === np.id) chip.style.background = m.onWhite;
    var dot = el('span','dot', m.name.charAt(0));
    dot.style.background = m.color;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(m.name));
    rot.appendChild(chip);
    if (i < MEMBERS.length - 1) rot.appendChild(el('span','rot-arrow','→'));
  });
  inner.appendChild(rot);
  screen.appendChild(inner);
  sb.appendChild(screen);
  sb.appendChild(el('div','screen-stand'));
  app.appendChild(sb);

  /* friday lineup */
  var lineup = el('div','lineup');
  lineup.appendChild(el('div','lu-head','📅 Coming Attractions'));
  var nf = AZ.nextFriday();
  var today = AZ.today();
  var npIdx = MEMBERS.indexOf(np);
  for (var u=0; u<4; u++){
    var fd = AZ.addDays(nf, u*7);
    var pm = MEMBERS[(npIdx + u) % MEMBERS.length];
    var row = el('div','lu-row' + (u===3 ? ' last' : ''));
    var dt = el('div','lu-date');
    dt.appendChild(el('div','d1', AZ.monthDay(fd)));
    var away = AZ.daysBetween(today, fd);
    dt.appendChild(el('div','d2', away === 0 ? 'Tonight!' : away === 1 ? 'Tomorrow' : 'in ' + away + ' days'));
    row.appendChild(dt);
    var lp = el('div','lu-pick');
    var ld = el('span','dot', pm.name.charAt(0));
    ld.style.background = pm.color;
    lp.appendChild(ld);
    var lname = el('span', null, pm.name + '’s pick');
    lname.style.color = pm.color;
    lp.appendChild(lname);
    row.appendChild(lp);
    row.appendChild(el('div','lu-fill'));
    lineup.appendChild(row);
  }
  lineup.appendChild(el('div','lu-head second','🍿 Recent Fridays'));
  for (var p=1; p<=4; p++){
    var pf = AZ.addDays(nf, -7*p);
    var night = nightNearDate(pf);
    var prow = el('div','lu-row' + (p===4 ? ' last' : ''));
    var pdt = el('div','lu-date');
    pdt.appendChild(el('div','d1', AZ.monthDay(pf)));
    pdt.appendChild(el('div','d2','Friday'));
    prow.appendChild(pdt);
    if (night){
      prow.appendChild(el('div','lu-title', night.title));
      var pd = el('div','pdots');
      MEMBERS.forEach(function(m){
        var r = reactionFor(night.id, m.id);
        var dot = el('span','pdot' + (rxHasContent(r) ? '' : ' off'), m.name.charAt(0));
        if (rxHasContent(r)){
          dot.style.background = m.color;
          dot.style.borderColor = m.color;
        }
        pd.appendChild(dot);
      });
      prow.appendChild(pd);
    } else {
      prow.appendChild(el('div','lu-title skip','no movie night 😴'));
    }
    lineup.appendChild(prow);
  }
  app.appendChild(lineup);

  /* quote sticky note */
  var quotes = allQuotes();
  if (quotes.length){
    var qw = el('div','quotewall');
    qw.setAttribute('role','button');
    qw.setAttribute('tabindex','0');
    var q = quotes[quoteIndex % quotes.length];
    var sticky = el('div','sticky');
    sticky.appendChild(el('blockquote', null, '“' + q.quote + '”'));
    sticky.appendChild(el('div','attr', '— ' + q.member.name + ', ' + q.movie));
    qw.appendChild(sticky);
    qw.appendChild(el('div','hint','From the quote wall · tap for another'));
    function nextQuote(){ quoteIndex++; render(); }
    qw.addEventListener('click', nextQuote);
    qw.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); nextQuote(); } });
    app.appendChild(qw);
  }

  /* log button */
  var logBtn = el('button','log-btn','🍿 Log a Movie Night');
  logBtn.addEventListener('click', openAddNight);
  app.appendChild(logBtn);

  /* memory book */
  var list = nights();
  var divider = el('div','film-divider');
  divider.setAttribute('aria-hidden','true');
  app.appendChild(divider);
  app.appendChild(el('div','section-label','Our Movie Night Memory Book'));
  app.appendChild(el('div','section-sub', list.length ? list.length + ' night' + (list.length===1?'':'s') + ' together 🍿' : ''));
  if (!list.length){
    var es = el('div','empty-state');
    es.appendChild(el('div','big','🛋️🍿'));
    es.appendChild(el('div', null, 'The memory book is empty!'));
    es.appendChild(el('div', null, 'Log your first Friday movie and start filling it up.'));
    app.appendChild(es);
  }
  list.forEach(function(n){
    var picker = memberById(n.pickedBy);
    var card = el('article','night');

    var head = el('div','head');
    var poster = el('div','poster');
    if (n.posterPath){
      var img = document.createElement('img');
      img.alt = ''; img.loading = 'lazy'; img.src = TMDB_IMG + n.posterPath;
      img.addEventListener('error', function(){
        img.remove();
        poster.style.background = n.grad || 'var(--card-2)';
        poster.appendChild(document.createTextNode(n.title));
      });
      poster.appendChild(img);
    } else {
      poster.style.background = n.grad || 'linear-gradient(160deg,#4E3E51,#2E2430)';
      poster.appendChild(document.createTextNode(n.title));
    }
    head.appendChild(poster);

    var ht = el('div','head-txt');
    ht.appendChild(el('h3', null, n.title));
    var meta = el('div','meta', (n.year ? n.year + ' · ' : '') + AZ.pretty(n.date));
    var avg = familyAvg(n.id);
    if (avg !== null) meta.appendChild(el('span','avgbadge', avg.toFixed(1) + ' ★'));
    ht.appendChild(meta);
    var ticket = el('span','ticket');
    var adm = el('span','admit','🎟');
    adm.style.background = picker.color;
    var tnm = el('span','tname', picker.name + '’s pick');
    tnm.style.background = picker.color;
    ticket.appendChild(adm);
    ticket.appendChild(tnm);
    ht.appendChild(ticket);
    if (n.sample) ht.appendChild(el('span','sampletag','sample'));
    head.appendChild(ht);
    card.appendChild(head);

    var rows = el('div','rx-rows');
    var reactedCount = 0;
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (rxHasContent(r)) reactedCount++;
      var row = el('button','rx-row');
      row.type = 'button';
      var who = el('span','who', m.name);
      who.style.color = m.color;
      row.appendChild(who);
      if (r && r.stars) row.appendChild(starsNode(r.stars));
      var snippetText = r ? (r.thought || rxQuotes(r)[0] || rxMemories(r)[0] || r.character || '') : '';
      if (snippetText){
        row.appendChild(el('span','snippet', snippetText));
      } else if (!r || !r.stars){
        row.appendChild(el('span','snippet empty','Tap to add your reaction'));
      } else {
        row.appendChild(el('span','snippet',''));
      }
      row.appendChild(el('span','chev','›'));
      row.addEventListener('click', function(){ openReaction(n, m); });
      rows.appendChild(row);
    });
    card.appendChild(rows);

    if (reactedCount > 0){
      var sb2 = el('button','scrapbtn');
      sb2.appendChild(document.createTextNode('📖 Open the night’s scrapbook'));
      if (reactedCount === MEMBERS.length){
        sb2.appendChild(el('span','done',' · complete! ✓'));
      } else {
        sb2.appendChild(el('span','', ' · ' + reactedCount + '/4 in'));
      }
      sb2.addEventListener('click', function(){ openScrapbook(n); });
      card.appendChild(sb2);
    }

    var del = el('button','del','✕');
    del.setAttribute('aria-label','Delete this night');
    del.addEventListener('click', function(){ deleteNight(n); });
    card.appendChild(del);

    app.appendChild(card);
  });

  /* footer */
  var footer = el('footer');
  footer.appendChild(el('div', null, 'Family Movie Night · Ortiz Family · Prototype v0.5'));
  var st = el('button', null, '⚙︎ Settings');
  st.addEventListener('click', openSettings);
  footer.appendChild(st);
  if (hasSample()){
    var cs = el('button', null, 'Clear sample data');
    cs.addEventListener('click', function(){
      confirmModal({
        title:'Clear the sample nights?',
        message:'The three demo nights and their reactions will be removed so you can start fresh.',
        confirmText:'Clear them',
        onConfirm: clearSample
      });
    });
    footer.appendChild(cs);
  }
  app.appendChild(footer);
}

/* ---------- RENDER: stats ---------- */
function memberStats(){
  var list = nights();
  var out = {};
  MEMBERS.forEach(function(m){
    out[m.id] = { member:m, picks:[], given:[], received:[], fives:0 };
  });
  list.forEach(function(n){
    if (out[n.pickedBy]) out[n.pickedBy].picks.push(n);
    var avg = familyAvg(n.id);
    if (avg !== null && out[n.pickedBy]) out[n.pickedBy].received.push(avg);
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (r && r.stars){
        out[m.id].given.push(r.stars);
        if (r.stars === 5) out[m.id].fives++;
      }
    });
  });
  return out;
}
function mean(arr){
  if (!arr.length) return null;
  var s = 0;
  for (var i=0;i<arr.length;i++) s += arr[i];
  return s / arr.length;
}
function fridayStreak(){
  var streak = 0;
  var f = AZ.addDays(AZ.nextFriday(), -7);
  while (nightNearDate(f)){
    streak++;
    f = AZ.addDays(f, -7);
  }
  return streak;
}
function renderStats(app){
  var list = nights();
  app.appendChild(el('div','section-label','Movie Night Stats'));
  app.appendChild(el('div','section-sub','The family record book 🏆'));

  if (!list.length){
    var es = el('div','empty-state');
    es.appendChild(el('div','big','📊'));
    es.appendChild(el('div', null, 'No stats yet — log a few movie nights first!'));
    app.appendChild(es);
    return;
  }

  var tiles = el('div','stat-tiles');
  var t1 = el('div','stat-tile');
  t1.appendChild(el('div','num', String(list.length)));
  t1.appendChild(el('div','lbl','Nights together'));
  tiles.appendChild(t1);
  var t2 = el('div','stat-tile');
  t2.appendChild(el('div','num', String(fridayStreak())));
  t2.appendChild(el('div','lbl','Friday streak 🔥'));
  tiles.appendChild(t2);
  app.appendChild(tiles);

  var stats = memberStats();

  /* superlative badges */
  var critic = null, pleaser = null;
  MEMBERS.forEach(function(m){
    var s = stats[m.id];
    var g = mean(s.given);
    if (g !== null && (critic === null || g < critic.v)) critic = { m:m, v:g };
    var rcv = mean(s.received);
    if (rcv !== null && (pleaser === null || rcv > pleaser.v)) pleaser = { m:m, v:rcv };
  });

  MEMBERS.forEach(function(m){
    var s = stats[m.id];
    var card = el('div','stat-member');
    card.style.borderLeftColor = m.color;
    var head = el('div','sm-head');
    var dot = el('span','sm-dot', m.name.charAt(0));
    dot.style.background = m.color;
    head.appendChild(dot);
    var nm = el('span','sm-name', m.name);
    nm.style.color = m.color;
    head.appendChild(nm);
    if (critic && critic.m.id === m.id) head.appendChild(el('span','sm-badge','🍅 toughest critic'));
    else if (pleaser && pleaser.m.id === m.id) head.appendChild(el('span','sm-badge','🎉 crowd pleaser'));
    card.appendChild(head);

    var grid = el('div','sm-grid');
    function cell(label, value){
      var c = el('div','sm-cell');
      c.appendChild(el('b', null, value));
      c.appendChild(document.createTextNode(' ' + label));
      grid.appendChild(c);
    }
    var g = mean(s.given);
    var rcv = mean(s.received);
    cell('picks made', String(s.picks.length));
    cell('★ given on avg', g === null ? '—' : g.toFixed(1));
    cell('their picks score', rcv === null ? '—' : rcv.toFixed(1) + ' ★');
    cell('five-star raves', String(s.fives));
    card.appendChild(grid);

    if (s.picks.length){
      var ph = el('div','sm-picks');
      ph.appendChild(document.createTextNode('🎬 Picked: '));
      s.picks.forEach(function(n, i){
        var avg = familyAvg(n.id);
        var b = el('b', null, n.title);
        ph.appendChild(b);
        ph.appendChild(document.createTextNode(avg !== null ? ' (' + avg.toFixed(1) + '★)' : ''));
        if (i < s.picks.length - 1) ph.appendChild(document.createTextNode(' · '));
      });
      card.appendChild(ph);
    }
    app.appendChild(card);
  });

  /* biggest split decision */
  var split = null;
  list.forEach(function(n){
    var rs = reactionsFor(n.id).filter(function(r){ return r.stars > 0; });
    if (rs.length < 2) return;
    var mn = 6, mx = 0, mnWho = null, mxWho = null;
    rs.forEach(function(r){
      if (r.stars < mn){ mn = r.stars; mnWho = memberById(r.member).name; }
      if (r.stars > mx){ mx = r.stars; mxWho = memberById(r.member).name; }
    });
    var spread = mx - mn;
    if (spread > 0 && (split === null || spread > split.spread)){
      split = { n:n, spread:spread, mn:mn, mx:mx, mnWho:mnWho, mxWho:mxWho };
    }
  });
  if (split){
    var sc = el('div','split-card');
    sc.appendChild(el('div','sc-title','💥 Biggest Split Decision'));
    sc.appendChild(el('div','sc-movie', split.n.title));
    sc.appendChild(el('div','sc-detail',
      split.mxWho + ' gave it ' + split.mx + '★ … ' + split.mnWho + ' gave it ' + split.mn + '★. The couch was divided.'));
    app.appendChild(sc);
  }

  var foot = el('footer');
  foot.appendChild(el('div', null, 'More coming: badges · one year ago tonight · the Ortiz Oscars'));
  app.appendChild(foot);
}

/* ---------- RENDER: trivia ---------- */
function renderTrivia(app){
  app.appendChild(el('div','section-label','Family Movie Trivia'));
  app.appendChild(el('div','section-sub','Answer together on the couch 🎯'));

  if (!trivia.order){
    trivia.order = shuffledOrder(TRIVIA.length);
    trivia.idx = 0; trivia.score = 0; trivia.answered = false; trivia.lastPick = -1;
    app.appendChild(el('div','tq-intro','One phone, four brains. Read each question out loud,\nargue about it, then lock in the family answer!'));
  }

  if (trivia.idx >= trivia.order.length){
    var done = el('div','tq-done');
    var pct = trivia.score / trivia.order.length;
    done.appendChild(el('div','big', pct >= 0.8 ? '🏆' : pct >= 0.5 ? '🎬' : '🍿'));
    done.appendChild(el('div','score-line', 'Family score: ' + trivia.score + ' / ' + trivia.order.length));
    done.appendChild(el('p', null, pct >= 0.8
      ? 'Certified movie family. Roll credits and take a bow!'
      : pct >= 0.5 ? 'Solid! A few more Friday nights and you’ll sweep it.'
      : 'The fix is obvious: more movie nights.'));
    var again = el('button','tq-next','Play Again');
    again.addEventListener('click', function(){ trivia.order = null; render(); });
    done.appendChild(again);
    app.appendChild(done);
    return;
  }

  var qi = trivia.order[trivia.idx];
  var Q = TRIVIA[qi];
  var card = el('div','tq-card');
  var prog = el('div','tq-progress');
  prog.appendChild(el('span', null, 'Question ' + (trivia.idx+1) + ' of ' + trivia.order.length));
  prog.appendChild(el('span','score','Score: ' + trivia.score));
  card.appendChild(prog);
  card.appendChild(el('div','tq-q', Q.q));

  var opts = el('div','tq-opts');
  Q.opts.forEach(function(opt, i){
    var b = el('button','tq-opt', opt);
    b.type = 'button';
    if (trivia.answered){
      b.disabled = true;
      if (i === Q.a) b.classList.add('correct');
      else if (i === trivia.lastPick) b.classList.add('wrong');
    } else {
      b.addEventListener('click', function(){
        trivia.answered = true;
        trivia.lastPick = i;
        if (i === Q.a){
          trivia.score++;
          confettiBurst(14);
        }
        render();
      });
    }
    opts.appendChild(b);
  });
  card.appendChild(opts);

  if (trivia.answered){
    card.appendChild(el('div','tq-note', (trivia.lastPick === Q.a ? '✓ Correct! ' : '✗ Not this time. ') + (Q.note || '')));
    var next = el('button','tq-next', trivia.idx + 1 >= trivia.order.length ? 'See the Final Score' : 'Next Question');
    next.addEventListener('click', function(){
      trivia.idx++;
      trivia.answered = false;
      trivia.lastPick = -1;
      render();
      window.scrollTo(0, 0);
    });
    card.appendChild(next);
  }
  app.appendChild(card);

  var foot = el('footer');
  foot.appendChild(el('div', null, '24 questions in the starter reel · fresh packs coming with v1.x'));
  app.appendChild(foot);
}

/* ---------- master render ---------- */
function render(){
  var app = document.getElementById('app');
  while (app.firstChild) app.removeChild(app.firstChild);
  renderHeader(app);
  if (view === 'home') renderHome(app);
  else if (view === 'stats') renderStats(app);
  else renderTrivia(app);
  renderTabbar();
}

seedSample();
render();
</script>
